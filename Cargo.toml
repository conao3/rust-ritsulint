[package]
name = "ritsulint"
description = "A linter for Japanese statutes: finds read-as clauses whose quoted words are missing from the provision they name"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/conao3/rust-ritsulint"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
leanfran = { version = "0.6.0", default-features = false }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
