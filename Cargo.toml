[package]
name = "ritsulint"
description = "A linter for Japanese statutes: finds quotations, references by position, numbers and tables of contents that no longer agree with the text of the law"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/conao3/rust-ritsulint"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
leanfran = { version = "0.14.0", default-features = false }
regex = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
